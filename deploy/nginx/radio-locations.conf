# Include inside the existing HTTPS server; paths refer to read-only Radio mounts.
location = /radio {
    return 301 /radio/$is_args$args;
}
location = /radio/api {
    return 308 /radio/api/$is_args$args;
}
location ^~ /radio/api/ {
    if (-f /srv/radio-maintenance/enabled) { return 503; }
    error_page 503 =503 @radio_api_maintenance;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $radio_api radio-api:3001;
    rewrite ^/radio/(.*)$ /$1 break;
    proxy_pass http://$radio_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
    proxy_read_timeout 60s;
}
location @radio_api_maintenance {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Retry-After 120 always;
    return 503 '{"error":{"code":"MAINTENANCE","message":"Service temporarily unavailable"}}';
}
location ^~ /radio/ {
    if (-f /srv/radio-maintenance/enabled) { return 503; }
    error_page 503 =503 /radio-maintenance.html;
    root /srv/radio/current;
    rewrite ^/radio/(.*)$ /$1 break;
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    try_files $uri @radio_navigation;
}
location @radio_navigation {
    root /srv/radio/current;
    if ($request_method !~ ^(GET|HEAD)$) { return 404; }
    if ($http_accept !~* text/html) { return 404; }
    if ($uri ~ \.[^/]+$) { return 404; }
    add_header Cache-Control no-cache always;
    try_files /index.html =404;
}
location = /radio-maintenance.html {
    internal;
    alias /srv/radio/maintenance.html;
    add_header Cache-Control no-store always;
    add_header Retry-After 120 always;
}
