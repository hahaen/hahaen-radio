name: Android Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed APK to GitHub Releases
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install workspace dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build with the existing release signing key
        env:
          ANDROID_RELEASE_SIGNING: ${{ secrets.ANDROID_RELEASE_SIGNING }}
        run: |
          if [[ -z "$ANDROID_RELEASE_SIGNING" ]]; then
            echo "::error::Configure ANDROID_RELEASE_SIGNING in the android-release environment."
            exit 1
          fi

          umask 077
          signing_dir="$GITHUB_WORKSPACE/.local/signing"
          mkdir -p "$signing_dir"
          trap 'rm -f "$signing_dir/release.properties" "$signing_dir/haen-release.jks"' EXIT
          printf '%s' "$ANDROID_RELEASE_SIGNING" | base64 --decode |
            tar -xzf - -C "$signing_dir" release.properties haen-release.jks
          unset ANDROID_RELEASE_SIGNING
          cd apps/android
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease
      - name: Verify the APK and read its version
        id: apk
        env:
          RELEASE_CERT_SHA256: 29784a08b1e0bbf3fac560ab96cdeb4b9a77622d2063a0be0fd51daf84be354c
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/36.0.0"

          certificate=$("$build_tools/apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p')
          if [[ "$certificate" != "$RELEASE_CERT_SHA256" ]]; then
            echo "::error::APK signer differs from the existing official release signer."
            exit 1
          fi

          badging=$("$build_tools/aapt" dump badging "$apk")
          version=$(sed -n "s/^package: name='xyz\.hahaen\.radio' versionCode='[1-9][0-9]*' versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || grep -q '^application-debuggable' <<< "$badging"; then
            echo "::error::Unexpected package ID, version, or debuggable flag in the APK."
            exit 1
          fi

          cp "$apk" "haen-radio-$version.apk"
          printf 'Verified release signature and package xyz.hahaen.radio v%s.\n' "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.publish
        with:
          name: android-release
          path: haen-radio-${{ steps.apk.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-release
      - name: Publish versioned APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          ref="refs/tags/$tag"
          if release_url=$(gh release view "$tag" --json url --jq .url 2>/dev/null); then
            echo "::error::Release $tag already exists at $release_url. Inspect it before publishing this version again."
            exit 1
          fi

          refs=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GH_REPO.git" "$ref" "$ref^{}")
          if [[ -z "$refs" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" --silent
          else
            tag_commit=$(awk -v ref="$ref" '$2 == ref { direct = $1 } $2 == ref "^{}" { peeled = $1 } END { print (peeled ? peeled : direct) }' <<< "$refs")
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag points to another commit. Bump the Android version before publishing."
              exit 1
            fi
          fi

          gh release create "$tag" --verify-tag --title "声屿 HAEN $VERSION" \
            --notes "Android 正式签名 APK，支持 Android 8 及以上。" "haen-radio-$VERSION.apk"
