# Loopback inside the shared gateway container; no host port is published.
server {
    listen 127.0.0.1:8089;
    server_name localhost;
    root /srv/radio/current;
    access_log off;
    location = /maintenance {
        if (-f /srv/radio-maintenance/enabled) { return 200 enabled; }
        return 200 disabled;
    }
    location = /release {
        try_files /index.html =404;
    }
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $radio_api radio-api:3001;
        proxy_pass http://$radio_api;
    }
    location / {
        try_files $uri =404;
    }
}
