<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-src 'none'"
    />
    <title>HAEN</title>
    <style>
      :root {
        --color-bg: #081310;
        --color-surface: #142923;
        --color-secondary: #91aaa0;
        --color-text: #f5f1e8;
        --color-accent: #f36b45;
      }
      html,
      body,
      #scene {
        margin: 0;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
        background: var(--color-bg);
        touch-action: none;
      }
      #scene,
      #immersion-scene {
        position: fixed;
        inset: 0;
      }
      #immersion-scene {
        background: var(--color-bg);
      }
      canvas {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      .starfield {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: var(--color-text);
        background:
          radial-gradient(
            ellipse at 17% 32%,
            color-mix(in srgb, var(--color-secondary) 2.5%, transparent),
            transparent 32%
          ),
          radial-gradient(
            ellipse at 92% 54%,
            color-mix(in srgb, var(--color-secondary) 3%, transparent),
            transparent 26%
          );
        mask-image: linear-gradient(transparent 4%, #000 19%, #000 65%, transparent 93%);
      }
      .distant-stars circle:nth-child(3n) {
        color: var(--color-secondary);
      }
      .star-beacons {
        opacity: 0.65;
      }
      .starfield[data-animated='true'] .star-beacons {
        animation: starlight 9s ease-in-out infinite;
      }
      @keyframes starlight {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.8;
        }
      }
      @media (width < 768px) {
        .starfield {
          opacity: 0.65;
          mask-image: linear-gradient(transparent, #000 20%, #000 72%, transparent);
        }
        .distant-stars circle:nth-child(even) {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .starfield[data-animated='true'] .star-beacons {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="scene"></div></div>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>
